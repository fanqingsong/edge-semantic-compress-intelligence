services:
  edge-agent:
    build:
      context: .
      dockerfile: services/edge-agent/Dockerfile
    environment:
      EDGE_HTTP_HOST: 0.0.0.0
      EDGE_HTTP_PORT: "8090"
      EDGE_MQTT_HOST: emqx
      EDGE_MQTT_PORT: "1883"
      EDGE_MQTT_TOPIC: edge/events
      EDGE_OUTBOX_PATH: /var/lib/edge-agent/outbox.sqlite3
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      EDGE_LLAMA_MODEL: ${EDGE_LLAMA_MODEL:-Qwen/Qwen2-1.5B-Instruct}
      EDGE_LLAMA_TIMEOUT: ${EDGE_LLAMA_TIMEOUT:-30}
    ports:
      - "8090:8090"
    volumes:
      - edge_outbox:/var/lib/edge-agent
    depends_on:
      emqx:
        condition: service_healthy
      mqtt-kafka-bridge:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  fluent-bit:
    image: fluent/fluent-bit:3.2.10
    volumes:
      - ./deploy/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./deploy/fluent-bit/normalize_syslog.lua:/fluent-bit/etc/normalize_syslog.lua:ro
      - ./examples/logs:/var/log/edge:ro
      - fluent_bit_state:/var/lib/fluent-bit
    ports:
      - "5514:5514/udp"
    depends_on:
      edge-agent:
        condition: service_healthy

  cloud-agent:
    build:
      context: .
      dockerfile: services/cloud-agent/Dockerfile
    environment:
      CLOUD_KAFKA_BOOTSTRAP: kafka:9092
      CLOUD_KAFKA_TOPIC: edge.events
      CLOUD_KAFKA_GROUP: cloud-agent
      CLOUD_MILVUS_URI: http://milvus:19530
      CLOUD_MILVUS_COLLECTION: ops_cases
      CLOUD_VECTOR_DIMENSION: "1024"
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      CLOUD_EMBEDDING_MODEL: ${CLOUD_EMBEDDING_MODEL:-BAAI/bge-m3}
      CLOUD_ANALYSIS_MODEL: ${CLOUD_ANALYSIS_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      CLOUD_ANALYSIS_TIMEOUT: ${CLOUD_ANALYSIS_TIMEOUT:-60}
      CLOUD_PROCESSED_DB: /var/lib/cloud/processed.sqlite3
      CLOUD_ANALYSIS_DB: /var/lib/cloud/analyses.sqlite3
    volumes:
      - cloud_data:/var/lib/cloud
    depends_on:
      kafka:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_HTTP_HOST: 0.0.0.0
      ADMIN_HTTP_PORT: "8088"
      ADMIN_ANALYSIS_DB: /var/lib/cloud/analyses.sqlite3
      ADMIN_PROCESSED_DB: /var/lib/cloud/processed.sqlite3
      ADMIN_JOB_DB: /var/lib/admin/jobs.sqlite3
      ADMIN_UPLOAD_DIR: /var/lib/admin/uploads
      EDGE_STATUS_URL: http://edge-agent:8090/v1/status
      CLOUD_MILVUS_URI: http://milvus:19530
      CLOUD_MILVUS_COLLECTION: ops_cases
      CLOUD_VECTOR_DIMENSION: "1024"
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      CLOUD_EMBEDDING_MODEL: ${CLOUD_EMBEDDING_MODEL:-BAAI/bge-m3}
    ports:
      - "8088:8088"
    volumes:
      - cloud_data:/var/lib/cloud
      - admin_data:/var/lib/admin
    depends_on:
      edge-agent:
        condition: service_healthy
      milvus:
        condition: service_healthy
      cloud-agent:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  knowledge-ingest:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: services/knowledge-ingest/Dockerfile
    command:
      - --path
      - /var/lib/knowledge
      - --milvus-uri
      - http://milvus:19530
      - --collection
      - ops_cases
      - --embedding-url
      - ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      - --embedding-model
      - ${CLOUD_EMBEDDING_MODEL:-BAAI/bge-m3}
    environment:
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
    volumes:
      - ./examples/knowledge/sources:/var/lib/knowledge:ro
    depends_on:
      milvus:
        condition: service_healthy

  emqx:
    image: emqx/emqx:5.9.3
    ports:
      - "1883:1883"
    environment:
      EMQX_LISTENERS__TCP__DEFAULT__ENABLE: "true"
      EMQX_LISTENERS__TCP__DEFAULT__BIND: "0.0.0.0:1883"
      EMQX_LISTENERS__SSL__DEFAULT__ENABLE: "false"
      EMQX_LISTENERS__WS__DEFAULT__ENABLE: "false"
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_DASHBOARD__DEFAULT_PASSWORD: Emqx-dev-1883
    volumes:
      - ./deploy/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  mqtt-kafka-bridge:
    build:
      context: .
      dockerfile: services/mqtt-kafka-bridge/Dockerfile
    environment:
      BRIDGE_MQTT_HOST: emqx
      BRIDGE_MQTT_PORT: "1883"
      BRIDGE_MQTT_TOPIC: edge/events
      BRIDGE_KAFKA_BOOTSTRAP: kafka:9092
      BRIDGE_KAFKA_TOPIC: edge.events
      BRIDGE_READY_FILE: /tmp/ready
    depends_on:
      emqx:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: bitnamilegacy/minio:2024.12.18
    command: minio server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/bitnami/minio/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  cloud_data:
  admin_data:
  edge_outbox:
  fluent_bit_state:
  etcd_data:
  minio_data:
  milvus_data:
  emqx_data:
  kafka_data: