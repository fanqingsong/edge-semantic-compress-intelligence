[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-semantic-compress-intelligence"
version = "0.1.0"
description = "Edge log filtering and cloud RAG pipeline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
edge-log-agent = "edge.agent.main:main"
cloud-rag-agent = "cloud.agent.main:main"
knowledge-ingest = "cloud.knowledge.main:main"
prompt-feedback = "cloud.feedback.main:main"

[project.optional-dependencies]
milvus = ["pymilvus>=2.4,<3"]
transport = ["msgpack>=1.0", "paho-mqtt>=2.0,<3"]
documents = ["markitdown>=0.1.3,<0.2"]

[tool.setuptools.packages.find]
where = ["services/edge/src", "services/cloud/src", "libs/shared/src"]