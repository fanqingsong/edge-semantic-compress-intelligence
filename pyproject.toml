[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-semantic-compress-intelligence"
version = "0.1.0"
description = "Edge log filtering and cloud RAG pipeline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
edge-log-agent = "edge_semantic_compress_intelligence.services.edge.main:main"
cloud-rag-agent = "edge_semantic_compress_intelligence.services.cloud.main:main"
knowledge-ingest = "edge_semantic_compress_intelligence.services.cloud.knowledge_main:main"
prompt-feedback = "edge_semantic_compress_intelligence.services.cloud.feedback_main:main"

[project.optional-dependencies]
milvus = ["pymilvus>=2.4,<3"]
transport = ["msgpack>=1.0", "paho-mqtt>=2.0,<3"]
documents = ["markitdown>=0.1.3,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]