[SERVICE]
    Flush                     1
    Grace                     30
    Log_Level                 info
    Parsers_File              parsers.conf

[INPUT]
    Name                      tail
    Tag                       edge.file
    Path                      /var/log/edge/*.jsonl
    Parser                    json
    DB                        /var/lib/fluent-bit/tail.db
    Read_from_Head            true
    Refresh_Interval           1
    Rotate_Wait               30
    Skip_Long_Lines           On

[INPUT]
    Name                      syslog
    Tag                       edge.syslog
    Mode                      udp
    Listen                    0.0.0.0
    Port                      5514
    Parser                    syslog-rfc5424

[FILTER]
    Name                      lua
    Match                     edge.syslog
    Script                    /fluent-bit/etc/normalize_syslog.lua
    Call                      normalize_syslog

# Drop info-level logs. Records with any other level, or with no level, are kept.
[FILTER]
    Name                      grep
    Match                     edge.*
    Exclude                   level ^(?i)(info|informational)$

[OUTPUT]
    Name                      http
    Match                     edge.*
    Host                      edge-agent
    Port                      8090
    URI                       /v1/logs
    Format                    json_lines
    Json_Date_Key             timestamp
    Json_Date_Format          iso8601
    Retry_Limit               no_limits
    Workers                   1