listener 8883 0.0.0.0
user mosquitto
allow_anonymous false
require_certificate true
use_identity_as_username true
cafile /mosquitto/runtime/certs/ca.crt
certfile /mosquitto/runtime/certs/broker.crt
keyfile /mosquitto/runtime/certs/broker.key
acl_file /mosquitto/runtime/aclfile
persistence true
persistence_location /mosquitto/data/
log_type warning
log_type notice