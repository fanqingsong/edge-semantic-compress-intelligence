[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-agent"
version = "0.1.0"
description = "Cloud RAG agent"
requires-python = ">=3.11"
dependencies = ["langgraph>=1,<2"]

[project.scripts]
cloud-rag-agent = "cloud.agent.main:main"

[project.optional-dependencies]
milvus = ["pymilvus>=2.4,<3"]
transport = ["msgpack>=1.0", "kafka-python-ng>=2.2.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
