[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-admin"
version = "0.1.0"
description = "Cloud operator console"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cloud-admin = "cloud.admin.main:main"

[project.optional-dependencies]
milvus = ["pymilvus>=2.4,<3"]
documents = ["markitdown>=0.1.3,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"cloud.admin" = ["static/*"]
