[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-ingest"
version = "0.1.0"
description = "Operations knowledge ingestion"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
knowledge-ingest = "cloud.knowledge.main:main"

[project.optional-dependencies]
milvus = ["pymilvus>=2.4,<3"]
documents = ["markitdown>=0.1.3,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
