[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedback-admin"
version = "0.1.0"
description = "Summary-quality feedback review"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
prompt-feedback = "cloud.feedback.main:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
